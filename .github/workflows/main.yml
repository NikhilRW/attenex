name: Release APK to Github Release

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SECRET: ${{ vars.GOOGLE_SERVICE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set UP JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: temurin

      - name: Set UP NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: 22.17.0

      - name: Cache Node.Js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NodeJs Dependencies
        run: npm install

      - name: Get google-services.json from secrets
        run: |
          mkdir personal
          cat << EOF > ./personal/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build APK
        run: npx expo prebuild -p android

      - name: Assemble Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Release the apk
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: android/app/build/outputs/apk/release/app-release.apk
          asset_name: app-release.apk
          tag: 0.0.1
          overwrite: true
          body: "Attenex apk release"
          prerelease: true
          make_latest:	true
          repo_name: "attenex"