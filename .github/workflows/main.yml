name: Release APK to Github Release

on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set UP JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: temurin

      - name: Set UP NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: 22.17.0

      - name: Cache Node.Js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NodeJs Dependencies
        run: npm install

      - name: Install Fastlane
        run: sudo gem install fastlane -NV

      # - name: Deploy In The Google Playstore
      #   run: |
      #     echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > android/fastlane/playstore-credentials.json
      #     cd android
      #     fastlane playstore

      - name: Send Discord Notification on Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content":"🚨 Google Playstore Deployment Failed"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Send Discord Notification on Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{"content":"✅ Google Playstore Deployment Successfulll Hooray !!!"}' \
               ${{ secrets.DISCORD_WEBHOOK_URL }}

