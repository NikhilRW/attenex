name: Release APK to Github Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      discussions: write
    env:
      GOOGLE_SECRET: ${{ vars.GOOGLE_SERVICE_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set UP JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: "17"
          distribution: temurin

      - name: Set UP NodeJS
        uses: actions/setup-node@v2
        with:
          node-version: 22.17.0

      - name: Cache Node.Js modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install NodeJs Dependencies
        run: npm install

      - name: Get google-services.json from secrets
        run: |
          mkdir personal
          cat << EOF > ./personal/google-services.json
          ${{ secrets.GOOGLE_SERVICES_JSON }}
          EOF

      - name: Build APK
        run: npx expo prebuild -p android

      - name: Assemble Release APK
        run: cd android && ./gradlew assembleRelease

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./android/app/build/outputs/apk/release/app-release.apk
          body: Latest Version Of Attenex {{ github.ref_name }} 